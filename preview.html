<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>G2プレビュー | レシピナビ</title>
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        background: #17181c;
        color: #e5e5e5;
        font: 15px/1.6 "Hiragino Sans", "Noto Sans JP", -apple-system, system-ui, sans-serif;
      }
      #app { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; box-sizing: border-box; }
      .title { font-size: 18px; font-weight: 700; margin: 0 0 4px; }
      .sub { font-size: 12px; color: #8a8f98; margin: 0 0 18px; }
      .sub a { color: #4ade80; }

      .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
      select, button {
        font: inherit; font-size: 13px; border-radius: 8px; border: 1px solid #3e3e3e;
        background: #2e2e2e; color: #e5e5e5; padding: 8px 12px; cursor: pointer;
      }
      .btn-start { background: #4ade80; color: #14281c; border: none; font-weight: 700; }

      /* G2実画面: 576x288 を等倍表示 */
      .hud-frame {
        width: 576px; max-width: 100%; aspect-ratio: 2 / 1;
        background: #000; border: 1px solid #2a2f36; border-radius: 6px;
        position: relative; overflow: hidden;
        margin: 0 auto;
      }
      .hud-container {
        position: absolute;
        color: #2bff7a;
        text-shadow: 0 0 6px rgba(43, 255, 122, 0.7);
        /* 実機LVGLフォントの字幅（CJK約20px・行高27px）に近づける */
        font-size: 18px;
        line-height: 27px;
        white-space: pre-wrap;
        word-break: break-all;
        overflow: hidden;
        box-sizing: border-box;
      }
      .hud-off {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        color: #3a4a40; font-size: 14px;
      }

      .gestures { display: flex; gap: 8px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
      .gestures button { min-width: 100px; }
      .keys { text-align: center; font-size: 12px; color: #8a8f98; margin-top: 10px; }
      .frame-label { text-align: center; font-size: 12px; color: #8a8f98; margin: 18px 0 8px; }
    </style>
  </head>
  <body>
    <div id="app">
      <h1 class="title">G2プレビュー — レシピナビ</h1>
      <p class="sub">
        実機の代わりにグラス画面（576×288・緑単色）をブラウザ上で再現します。
        コンパニオン画面は <a href="/index.html">こちら</a>。
      </p>

      <div class="toolbar">
        <label for="recipe-select">レシピ:</label>
        <select id="recipe-select"></select>
        <button id="start-btn" class="btn-start">▶ ナビ開始</button>
      </div>

      <div class="frame-label">Even G2 ディスプレイ（576×288）</div>
      <div id="hud" class="hud-frame">
        <div class="hud-off">ナビ未開始 — 「▶ ナビ開始」を押してください</div>
      </div>

      <div class="gestures">
        <button data-g="tap">タップ（次へ）</button>
        <button data-g="up">上スワイプ（戻る）</button>
        <button data-g="down">下スワイプ（タイマー）</button>
        <button data-g="double">2回タップ（終了）</button>
      </div>
      <p class="keys">キーボード: →/Space=タップ ・ ↑=上スワイプ ・ ↓=下スワイプ ・ Esc=2回タップ</p>
    </div>
    <script type="module" src="/src/preview.ts"></script>
  </body>
</html>
