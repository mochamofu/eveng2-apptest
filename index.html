<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <title>レシピナビ for Even G2</title>
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        background: #232323;
        color: #e5e5e5;
        font: 15px/1.6 "Hiragino Sans", "Noto Sans JP", -apple-system, system-ui, sans-serif;
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior: none;
      }
      #app { max-width: 560px; margin: 0 auto; padding: 16px 16px 48px; box-sizing: border-box; }

      .app-title { font-size: 19px; font-weight: 700; margin: 8px 0 2px; }
      .app-sub { font-size: 12px; color: #919191; margin: 0 0 16px; }

      .status {
        font-size: 12px; padding: 8px 12px; border-radius: 10px;
        background: #2e2e2e; border: 1px solid #3e3e3e; margin-bottom: 16px;
      }
      .status a { color: #4ade80; }

      .recipe-card {
        background: #2e2e2e; border: 1px solid #3e3e3e; border-radius: 14px;
        padding: 14px 16px; margin-bottom: 12px;
      }
      .recipe-head { display: flex; align-items: center; gap: 10px; }
      .recipe-name { flex: 1; font-size: 16px; font-weight: 600; }
      .recipe-meta { font-size: 12px; color: #919191; }
      .recipe-detail { font-size: 13px; color: #c5c5c5; margin-top: 10px; white-space: pre-wrap; }
      .recipe-actions { display: flex; gap: 8px; margin-top: 12px; }

      button {
        font: inherit; border: none; border-radius: 10px; padding: 9px 14px;
        cursor: pointer; font-size: 13px; font-weight: 600;
        -webkit-tap-highlight-color: transparent;
      }
      .btn-start { background: #4ade80; color: #14281c; flex: 1; }
      .btn-ghost { background: #3a3a3a; color: #e5e5e5; }
      .btn-danger { background: #4a2c2c; color: #f0a0a0; }
      .btn-add { width: 100%; background: #3a3a3a; color: #e5e5e5; padding: 13px; margin-top: 4px; }

      .form { background: #2e2e2e; border: 1px solid #3e3e3e; border-radius: 14px; padding: 16px; margin-top: 12px; }
      .form label { display: block; font-size: 12px; color: #919191; margin: 10px 0 4px; }
      .form input, .form textarea {
        width: 100%; box-sizing: border-box; background: #232323; color: #e5e5e5;
        border: 1px solid #3e3e3e; border-radius: 8px; padding: 9px; font: inherit; font-size: 14px;
      }
      .form textarea { min-height: 90px; resize: vertical; }
      .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
      .url-row { display: flex; gap: 8px; }
      .url-row input { flex: 1; }
      .url-row button { flex-shrink: 0; }
      .import-status { font-size: 12px; color: #4ade80; margin-top: 6px; min-height: 1em; line-height: 1.5; }

      /* セッション中のミラー表示 */
      .session { position: fixed; inset: 0; background: #1a1a1a; z-index: 10; padding: 20px 16px; box-sizing: border-box; }
      .session-inner { max-width: 560px; margin: 0 auto; }
      .mirror {
        background: #000; border: 1px solid #2f5c3f; border-radius: 12px;
        padding: 16px; margin-top: 16px; color: #2bff7a; font-size: 15px;
        min-height: 140px; white-space: pre-wrap;
        text-shadow: 0 0 8px rgba(43, 255, 122, 0.4);
      }
      .mirror-head { display: flex; justify-content: space-between; font-size: 13px; opacity: 0.8; margin-bottom: 10px; }
      .session-hint { font-size: 12px; color: #919191; text-align: center; margin-top: 14px; line-height: 1.8; }
      .btn-stop { width: 100%; margin-top: 16px; background: #4a2c2c; color: #f0a0a0; padding: 13px; }

      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
